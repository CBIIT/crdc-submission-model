
name: Model Validate and Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-and-build:
    permissions:
      packages: read
      contents: write
    uses: CBIIT/bento-workflows/.github/workflows/model-test-and-deploy.yml@v2.3.15
    with:
      model_files: |
        crdc-submission-model.yml crdc-submission-model-properties.yml
      model_prefix: crdc-submission-model
      event_name: ${{ github.event_name }}
      nodes_only_graph: yes
      no_docs: yes
    secrets:
      token: ${{ secrets.PAT }}
